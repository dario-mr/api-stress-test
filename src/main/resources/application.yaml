server:
  port: ${PORT:8083}
  servlet.session.timeout: 30d
  forward-headers-strategy: framework # honor the original external request context (host, scheme, prefix)

spring:
  application.name: api-stress-test
  profiles.active: ${PROFILE:prod}
  config.import: optional:file:.env[.properties] # enable scanning of .env file

management:
  endpoints:
    web.exposure.include: health,info,prometheus
  endpoint:
    health.probes.enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# Google OAuth
oath.google.url: /oauth2/authorization/google
spring.security.oauth2.client.registration:
  google:
    client-id: ${OAUTH_CLIENT_ID}
    client-secret: ${OAUTH_CLIENT_SECRET}
    scope: openid, profile, email
    authorization-grant-type: authorization_code

# Security
security.whitelist.ant-patterns: /icons/**,/images/**,/h2-console/**,/actuator/health,/actuator/info,/actuator/prometheus
app.encryption.secret-key: ${ENCRYPTION_KEY}

logging.level.com.dario.ast: DEBUG