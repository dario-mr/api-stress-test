<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      font-family: system-ui, 'Segoe UI', sans-serif;
      background: -webkit-linear-gradient(120deg, #1e3c72 30%, #3975da);
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    img {
      width: 100px;
      margin-bottom: 20px;
    }

    .spinner {
      border: 6px solid rgba(255, 255, 255, 0.2);
      border-top: 6px solid #fff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    h2 {
      margin: 0;
      font-weight: 400;
      font-size: 18px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
<img src="logo.png" alt="App Logo"/>
<div class="spinner"></div>
<h2>Launching app...</h2>
</body>
</html>
